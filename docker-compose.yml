version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tr-tech-backend
    ports:
      - '5000:5000'
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Point the container at the mongodb service below. The MONGODB_URI in .env
      # targets Atlas, which would leave the mongodb service unused. Drop this
      # line to run the container against Atlas instead.
      - MONGODB_URI=mongodb://mongodb:27017/tr-tech
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      tr-tech-network:
        # nginx.conf in tr-tech-frontend proxies to the host `backend`, not to
        # the container name tr-tech-backend.
        aliases:
          - backend
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:5000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  mongodb:
    image: mongo:7
    container_name: tr-tech-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data/db
    networks:
      - tr-tech-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongodb-data:

networks:
  # Pinned so the tr-tech-frontend stack can join the same network. Compose warns
  # that the network was not created by this project when the other stack claims
  # the name first; that warning is expected and safe.
  tr-tech-network:
    name: tr-tech-network
    driver: bridge
